name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.15-${{ runner.os }}

      - name: WebView2 SDK a Ruffle
        shell: bash
        run: |
          mkdir -p ext/webview2/Microsoft.Web.WebView2.1.0.1901.177
          curl -fsSL -o ext/wv2.zip "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.1901.177"
          (cd ext/webview2/Microsoft.Web.WebView2.1.0.1901.177 && unzip -q ../../wv2.zip)
          echo "WV2_DIR=$(cd ext/webview2 && pwd -W)" >> "$GITHUB_ENV"
          # Ruffle (Flash) – pevna verzia, bez .map suborov
          curl -fsSL -o ext/ruffle-full.zip "https://github.com/ruffle-rs/ruffle/releases/download/nightly-2026-10-02/ruffle-nightly-2026_10_02-web-selfhosted.zip"
          mkdir -p ext/ruffle && (cd ext/ruffle && unzip -q ../ruffle-full.zip && rm -f *.map README.md package.json && 7z a -tzip -mx=9 ../ruffle-web.zip . > /dev/null)
          ls -la ext/ruffle-web.zip

      - name: Configure
        # úvodzovky sú nutné: PowerShell by -DKP_VERSION=1.0.25 rozdelil na bodke a ostalo by "1"
        run: cmake -B build -A x64 "-DKP_VERSION=1.0.${{ github.run_number }}" "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ env.WV2_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Selftest
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/KorgusPlayer_artefacts/Release/Korgus Player.exe" -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Installer
        continue-on-error: true
        shell: pwsh
        run: |
          git fetch --depth 1 origin libmpv
          git archive --format=zip -o mpv-branch.zip origin/libmpv
          Expand-Archive mpv-branch.zip -DestinationPath mpvbranch -Force
          Expand-Archive mpvbranch/libmpv-2.zip -DestinationPath mpv -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          New-Item -ItemType Directory -Force out | Out-Null
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" installer\KorgusPlayer.iss
          Get-ChildItem out

      - name: Testy (nahlady, ZIP, premenovanie)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/KorgusPlayer_artefacts/Release/Korgus Player.exe" -ArgumentList "--test" -PassThru -Wait -RedirectStandardOutput "test.txt"
          Get-Content test.txt -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Test prevodu videa
        continue-on-error: true
        shell: pwsh
        run: |
          $rel = "build/KorgusPlayer_artefacts/Release"
          Copy-Item mpv/libmpv-2.dll $rel/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force vtest | Out-Null
          foreach ($t in @("mp4 0 720 1", "mkv 1 0 0", "webm 2 480 2", "mp3 3 0 1")) {
            $a = $t.Split(" ")
            $src = if ($a[0] -eq "mp3") { "av://lavfi:sine=d=3" } else { "av://lavfi:testsrc2=d=3:s=1920x1080:r=25" }
            $o = (Resolve-Path vtest).Path + "\t_" + $a[0] + "." + $a[0]
            $p = Start-Process -FilePath "$rel/Korgus Player.exe" -ArgumentList "--vconv `"$src`" `"$o`" $($a[1]) $($a[2]) $($a[3])" -PassThru -Wait -RedirectStandardOutput "vtest/$($a[0]).txt"
            Get-Content "vtest/$($a[0]).txt" | Select-Object -Last 1
          }
          Remove-Item $rel/libmpv-2.dll -ErrorAction SilentlyContinue

      - name: Publish to build branch
        shell: bash
        run: |
          V=1.0.${{ github.run_number }}
          mkdir -p out
          cp "build/KorgusPlayer_artefacts/Release/Korgus Player.exe" out/
          echo "$V" > out/version.txt
          cd out
          git init -q
          git checkout -q -b build
          git add .
          git -c user.name="Korgus CI" -c user.email="ci@korgus.local" commit -qm "Build $V"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build

      - uses: actions/upload-artifact@v4
        with:
          name: KorgusPlayer-1.0.${{ github.run_number }}
          path: out/*

      # libmpv pre prehrávanie videa (dáva sa vedľa programu ako libmpv-2.dll).
      # DLL má cez 100 MB, preto ide zbalená do vetvy libmpv – len keď vyjde nová verzia.
      - name: Publish libmpv
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-*' -and $_.name -notlike '*v3*' } | Select-Object -First 1 }
          $ver = "$($rel.tag_name) $($asset.name)"
          $current = ""
          try { $current = (gh api "repos/${{ github.repository }}/contents/libmpv-verzia.txt?ref=libmpv" --jq .content | ForEach-Object { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($_)) }).Trim() } catch {}
          Write-Host "libmpv: najnovsia '$ver', vo vetve '$current'"
          if ($current -eq $ver) { Write-Host "bez zmeny"; exit 0 }
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          New-Item -ItemType Directory -Force mpvout | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          Compress-Archive -Path $dll.FullName -DestinationPath mpvout/libmpv-2.zip -CompressionLevel Optimal
          Set-Content -Path mpvout/libmpv-verzia.txt -Value $ver -NoNewline
          Get-ChildItem mpvout
          cd mpvout
          git init -q
          git checkout -q -b libmpv
          git add .
          git -c user.name="Korgus CI" -c user.email="ci@korgus.local" commit -qm "libmpv $ver"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" libmpv
