name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        # úvodzovky sú nutné: PowerShell by -DKP_VERSION=1.0.25 rozdelil na bodke a ostalo by "1"
        run: cmake -B build -A x64 "-DKP_VERSION=1.0.${{ github.run_number }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Selftest
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/KorgusPlayer_artefacts/Release/Korgus Player.exe" -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Publish to build branch
        shell: bash
        run: |
          V=1.0.${{ github.run_number }}
          mkdir out
          cp "build/KorgusPlayer_artefacts/Release/Korgus Player.exe" out/
          echo "$V" > out/version.txt
          cd out
          git init -q
          git checkout -q -b build
          git add .
          git -c user.name="Korgus CI" -c user.email="ci@korgus.local" commit -qm "Build $V"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build

      - uses: actions/upload-artifact@v4
        with:
          name: KorgusPlayer-1.0.${{ github.run_number }}
          path: out/*

      # libmpv pre prehrávanie videa (dáva sa vedľa programu ako libmpv-2.dll).
      # DLL má cez 100 MB, preto ide zbalená do vetvy libmpv – len keď vyjde nová verzia.
      - name: Publish libmpv
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-*' -and $_.name -notlike '*v3*' } | Select-Object -First 1 }
          $ver = "$($rel.tag_name) $($asset.name)"
          $current = ""
          try { $current = (gh api "repos/${{ github.repository }}/contents/libmpv-verzia.txt?ref=libmpv" --jq .content | ForEach-Object { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($_)) }).Trim() } catch {}
          Write-Host "libmpv: najnovsia '$ver', vo vetve '$current'"
          if ($current -eq $ver) { Write-Host "bez zmeny"; exit 0 }
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          New-Item -ItemType Directory -Force mpvout | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          Compress-Archive -Path $dll.FullName -DestinationPath mpvout/libmpv-2.zip -CompressionLevel Optimal
          Set-Content -Path mpvout/libmpv-verzia.txt -Value $ver -NoNewline
          Get-ChildItem mpvout
          cd mpvout
          git init -q
          git checkout -q -b libmpv
          git add .
          git -c user.name="Korgus CI" -c user.email="ci@korgus.local" commit -qm "libmpv $ver"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" libmpv
